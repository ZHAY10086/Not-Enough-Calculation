name: Build and publish

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_release: ${{ steps.version.outputs.is_release }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "VERSION=$version" >> "$GITHUB_ENV"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew clean build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Publish GitHub release
        if: steps.version.outputs.is_release == 'true' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Not Enough Calculation ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            build/libs/*-${{ steps.version.outputs.version }}.jar
          fail_on_unmatched_files: true

      - name: Publish to CurseForge
        if: steps.version.outputs.is_release == 'true' && github.event_name == 'push'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            build/libs/*-${{ steps.version.outputs.version }}.jar
          name: Not Enough Calculation ${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-type: release
          changelog-file: CHANGELOG.md
          loaders: forge
          game-versions: 1.12.2
